# ---------------------------------------------------------------------------
# Blimp SITL — docker-compose
#
# The image carries ArduPilot SITL + custom ArduMotorBlimp vehicle
# (compiled at build time, pinned tag).
# THIS compose file mounts your params and Lua scripts into the container at
# runtime. SITL is launched FROM the ardupilot directory.
# ---------------------------------------------------------------------------

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: blimp/sitl:0.1.0
  network_mode: host          # exposes 5760 (TCP) / 14550 (UDP) on localhost
  stdin_open: true
  tty: true
  environment:
    - DISPLAY                 # only needed if you use --map (X forwarding)
    - QT_X11_NO_MITSHM=1
  volumes:
    - ./params:/home/blimp/blimp-flight/params:rw
    - ./scripts:/home/blimp/blimp-flight/scripts:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${HOME}/.Xauthority:/home/blimp/.Xauthority:rw
  working_dir: /home/blimp/ardupilot

services:
  # --------------------------------------------------------------------------
  # Build: builds the Docker image from Dockerfile.
  # --------------------------------------------------------------------------
  sitl-build:
    build:
      context: .
      args:
        - USER_UID=${UID:-1000}
        - USER_GID=${GID:-1000}
    image: blimp/sitl:0.1.0
    entrypoint: ["true"]

  # --------------------------------------------------------------------------
  # Default: interactive shell. You start SITL yourself (full control).
  # --------------------------------------------------------------------------
  sitl:
    <<: *common
    container_name: blimp_sitl
    command: ["/bin/bash", "-lc", "exec bash"]

  # --------------------------------------------------------------------------
  # One-shot: boots SITL straight into your params, no map (headless).
  # Connect a GCS (QGC / Mission Planner / MAVProxy) to udp:127.0.0.1:14550
  # or tcp:127.0.0.1:5760.
  # --------------------------------------------------------------------------
  sitl-auto:
    <<: *common
    container_name: blimp_sitl_auto
    command:
      - "/bin/bash"
      - "-lc"
      - >
        sim_vehicle.py -v ArduMotorBlimp
        --console -w --no-rebuild
