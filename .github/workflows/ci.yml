name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pymavlink fastapi uvicorn pydantic websockets httpx flake8

    - name: Lint with flake8
      run: |
        # Проверяем синтаксис и базовые ошибки, игнорируя стиль для скорости
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=.venv,venv,__pycache__,.git

    - name: Run Unit Tests
      run: |
        # Запускаем только юнит-тесты (без интеграционных, требующих SITL)
        # Тесты лежат в корне репозитория
        pytest test_mavlink_backend.py -v -k "not integration" \
          --cov=mavlink_backend --cov-report=xml

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false